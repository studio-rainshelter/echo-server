openapi: 3.0.3
info:
  title: Echo Server REST API
  description: 웹소켓 에코 서버의 로그 및 통계 조회를 위한 REST API
  version: 1.0.0
  contact:
    name: Echo Server Team

servers:
  - url: http://localhost:3001/api
    description: 개발 환경
  - url: https://echo-server.example.com/api
    description: 프로덕션 환경

tags:
  - name: Logs
    description: 메시지 로그 조회
  - name: Statistics
    description: 서버 통계 조회
  - name: Connections
    description: 활성 연결 정보 조회

paths:
  /logs/messages:
    get:
      tags:
        - Logs
      summary: 메시지 로그 목록 조회
      description: 최근 메시지 로그를 시간 역순으로 조회합니다 (최대 1000개)
      parameters:
        - name: limit
          in: query
          description: 조회할 로그 개수 (기본값: 100, 최대: 1000)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: offset
          in: query
          description: 건너뛸 로그 개수 (페이지네이션)
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: connectionId
          in: query
          description: 특정 연결 ID로 필터링
          required: false
          schema:
            type: string
            example: conn-1699564832123-a9b3c4d5e
        - name: messageType
          in: query
          description: 메시지 타입으로 필터링
          required: false
          schema:
            type: string
            enum: [text, json, binary]
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      logs:
                        type: array
                        items:
                          $ref: '#/components/schemas/MessageLog'
                      total:
                        type: integer
                        description: 전체 로그 개수
                        example: 150
                      limit:
                        type: integer
                        example: 100
                      offset:
                        type: integer
                        example: 0
        '400':
          description: 잘못된 요청 (잘못된 파라미터)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /logs/events:
    get:
      tags:
        - Logs
      summary: 연결 이벤트 목록 조회
      description: 연결/해제 이벤트를 시간 역순으로 조회합니다
      parameters:
        - name: limit
          in: query
          description: 조회할 이벤트 개수 (기본값: 100, 최대: 1000)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
        - name: eventType
          in: query
          description: 이벤트 타입으로 필터링
          required: false
          schema:
            type: string
            enum: [connected, disconnected]
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      events:
                        type: array
                        items:
                          $ref: '#/components/schemas/ConnectionEvent'
                      total:
                        type: integer
                        example: 50

  /statistics:
    get:
      tags:
        - Statistics
      summary: 서버 통계 조회
      description: 현재 서버의 전체 통계 정보를 조회합니다
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Statistics'

  /connections:
    get:
      tags:
        - Connections
      summary: 활성 연결 목록 조회
      description: 현재 활성 상태인 웹소켓 연결 목록을 조회합니다
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      connections:
                        type: array
                        items:
                          $ref: '#/components/schemas/ActiveConnection'
                      count:
                        type: integer
                        description: 활성 연결 개수
                        example: 5

  /connections/{connectionId}:
    get:
      tags:
        - Connections
      summary: 특정 연결 정보 조회
      description: 연결 ID로 특정 연결의 상세 정보를 조회합니다
      parameters:
        - name: connectionId
          in: path
          required: true
          description: 연결 ID
          schema:
            type: string
            example: conn-1699564832123-a9b3c4d5e
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ActiveConnection'
        '404':
          description: 연결을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /health:
    get:
      tags:
        - Statistics
      summary: 서버 상태 확인
      description: 서버가 정상 동작 중인지 확인합니다
      responses:
        '200':
          description: 서버 정상
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  uptime:
                    type: number
                    description: 서버 가동 시간 (초)
                    example: 23445
                  timestamp:
                    type: string
                    format: date-time
                    example: 2025-11-09T16:30:45.123Z

components:
  schemas:
    MessageLog:
      type: object
      properties:
        logId:
          type: string
          description: 고유 로그 ID
          example: log-1699564832456-x1y2z3
        connectionId:
          type: string
          description: 메시지를 전송한 연결 ID
          example: conn-1699564832123-a9b3c4d5e
        messageType:
          type: string
          enum: [text, json, binary]
          description: 메시지 타입
          example: text
        messageContent:
          type: string
          description: 메시지 내용 (바이너리는 Base64 인코딩)
          example: Hello, WebSocket!
        messageSize:
          type: integer
          description: 메시지 크기 (바이트)
          example: 18
        timestamp:
          type: string
          format: date-time
          description: 메시지 수신 시각 (ISO 8601)
          example: 2025-11-09T16:30:45.123Z
        clientInfo:
          type: object
          properties:
            ip:
              type: string
              description: 클라이언트 IP 주소
              example: 192.168.1.100
            userAgent:
              type: string
              description: 클라이언트 User-Agent
              example: Mozilla/5.0 (Windows NT 10.0; Win64; x64)

    ConnectionEvent:
      type: object
      properties:
        eventId:
          type: string
          description: 고유 이벤트 ID
          example: event-1699564832789-p9q8r7
        eventType:
          type: string
          enum: [connected, disconnected]
          description: 이벤트 타입
          example: connected
        connectionId:
          type: string
          description: 관련된 연결 ID
          example: conn-1699564832123-a9b3c4d5e
        timestamp:
          type: string
          format: date-time
          description: 이벤트 발생 시각 (ISO 8601)
          example: 2025-11-09T16:30:45.123Z
        clientInfo:
          type: object
          properties:
            ip:
              type: string
              example: 192.168.1.100
            userAgent:
              type: string
              example: Mozilla/5.0
        reason:
          type: string
          description: 연결 해제 이유 (disconnected 타입인 경우)
          example: client_close

    Statistics:
      type: object
      properties:
        currentActiveConnections:
          type: integer
          description: 현재 활성 연결 수
          example: 5
        totalConnectionsAttempted:
          type: integer
          description: 총 연결 시도 횟수
          example: 42
        totalMessagesReceived:
          type: integer
          description: 총 수신 메시지 수
          example: 150
        totalMessagesSent:
          type: integer
          description: 총 전송 메시지 수 (에코 응답)
          example: 150
        serverStartedAt:
          type: string
          format: date-time
          description: 서버 시작 시각 (ISO 8601)
          example: 2025-11-09T10:00:00.000Z
        uptimeSeconds:
          type: number
          description: 서버 가동 시간 (초)
          example: 23445

    ActiveConnection:
      type: object
      properties:
        connectionId:
          type: string
          description: 고유 연결 ID
          example: conn-1699564832123-a9b3c4d5e
        clientIp:
          type: string
          description: 클라이언트 IP 주소
          example: 192.168.1.100
        userAgent:
          type: string
          description: 클라이언트 User-Agent
          example: Mozilla/5.0
        connectedAt:
          type: string
          format: date-time
          description: 연결 수립 시각 (ISO 8601)
          example: 2025-11-09T16:30:45.123Z
        lastActivityAt:
          type: string
          format: date-time
          description: 마지막 활동 시각 (ISO 8601)
          example: 2025-11-09T16:35:12.456Z
        messageCount:
          type: integer
          description: 이 연결에서 전송한 메시지 수
          example: 10

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              description: 에러 코드
              example: INVALID_PARAMETER
            message:
              type: string
              description: 에러 메시지
              example: The 'limit' parameter must be between 1 and 1000
